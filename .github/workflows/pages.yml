name: Build and deploy Silver Labs website

on:
  push:
    branches:
      - website-development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test website
        run: |
          node --test tests/*.test.mjs
          node --check site.mjs
          node --check projects.mjs
          node --check scripts/serve.mjs
      - name: Prepare static Pages artifact
        run: |
          mkdir -p _site
          cp index.html styles.css projects.mjs site.mjs info.css project.css growth.html about.html contact.html faq.html listing.html privacy.html terms.html _site/
          cp -R projects _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
